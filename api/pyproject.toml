[project]
name = "costco-pump-api"
version = "0.1.0"
description = "API, scraper, and job workers for the Costco gas price tracker"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "asyncpg>=0.30",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "redis>=5.1",
  "geoalchemy2>=0.15",
  "rq>=1.16",
  "slowapi>=0.1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
# Supply-chain safety net, matching web/bunfig.toml's minimumReleaseAge:
# refuse to resolve any package version published less than 14 days ago,
# so a newly published (possibly compromised or broken) release has time
# for the community to catch it first. A true rolling window, not a fixed
# date -- re-running `uv lock` later re-evaluates against the new "now".
exclude-newer = "14 days"
