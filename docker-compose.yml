name: costco-pump

# This stack is deliberately independent of ericdoo-infra's compose file --
# updating/restarting this one never touches Caddy or the portfolio, and vice
# versa. `api` is the only service Caddy reaches, joining the `web` network
# that ericdoo-infra's Caddy container already publishes (see
# ../ericdoo-infra/docker-compose.yml -- bring that stack up first so the
# network exists, or run `docker network create web` before this). `worker`
# and `enqueuer` both reach *out* to Costco via `egress` -- see below.
# (enqueuer needs it too now: it fetches the warehouse ID manifest directly
# from Costco's site to build the price sweep, not just worker.)

# api, enqueuer, and worker all share one lean image (see api/Dockerfile --
# the scraper is a plain HTTP client, so there's no heavier browser image to
# split out anymore). Built locally by `build:` in dev (`docker compose up
# --build`) or pulled from GHCR in prod, where the server only ever has this
# file + .env, never the source -- see deploy.yml.
x-api-image: &api-image
  image: ghcr.io/ericdooo/costco-pump-api:latest
  build:
    context: ./api
    target: api

services:
  api:
    <<: *api-image
    container_name: costco-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://gas:${POSTGRES_PASSWORD}@postgres:5432/gas
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - web
      - backend
    deploy:
      resources:
        limits:
          memory: 512m

  # Drains the sweep queue. Add `--scale worker=N` (or duplicate this block)
  # later if the queue backs up -- nothing else changes. Needs `egress` (on
  # top of `backend`) because this is the one process that actually calls
  # out to Costco -- everything else only ever talks to postgres/redis.
  worker:
    <<: *api-image
    command: ["python", "worker.py"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://gas:${POSTGRES_PASSWORD}@postgres:5432/gas
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - backend
      - egress
    deploy:
      resources:
        limits:
          memory: 256m

  # Schedules the jobs `worker` consumes -- see enqueuer.py for why this is a
  # separate process from the worker itself. Needs `egress` (on top of
  # `backend`) same as worker: it fetches the warehouse ID manifest from
  # Costco's site directly to build the price sweep, not just DB/redis.
  enqueuer:
    <<: *api-image
    command: ["python", "enqueuer.py"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://gas:${POSTGRES_PASSWORD}@postgres:5432/gas
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - backend
      - egress
    deploy:
      resources:
        limits:
          memory: 256m

  # timescaledb-ha's `-all` tag bundles the timescaledb + postgis extensions
  # in one image, published for both amd64 and arm64.
  postgres:
    image: timescale/timescaledb-ha:pg16-all
    restart: unless-stopped
    environment:
      POSTGRES_USER: gas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: gas
    volumes:
      - pgdata:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gas"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 3g

  # Doubles as the API's response cache AND the RQ job queue's backend.
  # noeviction (not allkeys-lru) is deliberate: eviction is instance-wide in
  # Redis, so an LRU policy set for "it's just a cache" would just as happily
  # evict a pending job under memory pressure. Our real data volume here is
  # tiny (a few hundred queued jobs + small cache entries), so noeviction
  # just means a full instance errors loudly on writes instead of silently
  # losing one.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy noeviction
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 512m

networks:
  web:
    external: true
  backend:
    internal: true # no route to the internet; DB and cache stay isolated
  # Outbound-only for worker (reaching Costco), separate from `web` so worker
  # never shares a network with Caddy -- nothing needs to reach it inbound.
  egress:

volumes:
  pgdata:
