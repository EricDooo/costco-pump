name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-costco-pump
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Install deploy key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust the server's host key
        run: ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Rsync dist/ to the server
        run: |
          rsync -avz --delete \
            dist/ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:~/infra/site/costcogas/"

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # GitHub runners are x86; the VM is arm64 -- same cross-build setup
      # ericdoo-infra's docs call out for any service built here.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (arm64)
        uses: docker/build-push-action@v6
        with:
          context: ./api
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/ericdooo/costco-pump-api:latest
            ghcr.io/ericdooo/costco-pump-api:${{ github.sha }}

      - name: Install deploy key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust the server's host key
        run: ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      # docker-compose.yml is an ops file, not app source -- same as
      # ericdoo-infra's own compose file being cloned to the server. api/
      # and web/ never land there; the server only ever pulls the image.
      - name: Sync docker-compose.yml and restart the app services
        run: |
          rsync -avz docker-compose.yml \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:~/costco-pump/docker-compose.yml"
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" '
            cd ~/costco-pump &&
            docker compose pull api worker enqueuer &&
            docker compose up -d api worker enqueuer
          '
